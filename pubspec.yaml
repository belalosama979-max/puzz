name: buzz_master
description: BuzzMaster - Real-time Multiplayer Quiz Buzzer System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # Code Generation
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # Local Storage
  hive_flutter: ^1.1.0
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3

  # Networking
  network_info_plus: ^6.0.0

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # PDF & Export
  pdf: ^3.10.8
  printing: ^5.12.0
  csv: ^6.0.0
  share_plus: ^9.0.0
  permission_handler: ^11.3.1

  # Font
  google_fonts: ^6.2.1

  # Animations
  flutter_animate: ^4.5.0
  confetti: ^0.7.0

  # Audio & Haptics
  audioplayers: ^6.1.0
  vibration: ^2.0.0

  # Utilities
  uuid: ^4.4.0
  intl: ^0.20.0
  logger: ^2.4.0
  equatable: ^2.0.5
  collection: ^1.18.0
  connectivity_plus: ^6.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3
  custom_lint: ^0.7.3
  riverpod_lint: ^2.3.13

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
